<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Corujeira · the land</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#E4DDC5">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Lato:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --oak-dark:#3B4438; --clay:#E4DDC5; --earth:#2C2626;
  --bg:#E4DDC5; --ink:#2C2626; --ink-soft:rgba(44,38,38,.62); --line:rgba(59,68,56,.16); --line-strong:rgba(59,68,56,.32);
  --water:#4f7880; --water-fill:rgba(79,120,128,.26); --build:#d6ccad; --build-hov:#c3b48c; --build-stroke:#2C2626;
  --path:rgba(44,38,38,.45); --bed:rgba(150,110,70,.2); --spot:#8a3f1d; --panel:rgba(236,230,212,.9);
  --tree-fill:rgba(79,107,69,.28); --tree-line:rgba(59,68,56,.75); --shrub-fill:rgba(125,150,92,.3); --herb:#8b76a3;
  --sans:Lato,system-ui,sans-serif; --serif:Lora,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
/* widths in screen px via --px (metres per pixel) */
.contour{fill:none;stroke:var(--line);stroke-width:calc(var(--px)*.8)}
.contour.idx{stroke:var(--line-strong);stroke-width:calc(var(--px)*1.1)}
.drawing .contour{stroke-dasharray:1;stroke-dashoffset:1}
.drawn .contour{transition:stroke-dashoffset 2.6s cubic-bezier(.6,.1,.3,1);stroke-dashoffset:0}

.boundary{fill:none;stroke:var(--ink);stroke-opacity:.6;stroke-width:calc(var(--px)*1.3);stroke-dasharray:calc(var(--px)*7) calc(var(--px)*4)}
.terrace{fill:none;stroke:var(--ink-soft);stroke-width:calc(var(--px)*1.3);stroke-linecap:round}
.bank{fill:none;stroke:var(--ink-soft);stroke-opacity:.6;stroke-width:calc(var(--px)*.8);stroke-dasharray:calc(var(--px)*1) calc(var(--px)*3);stroke-linecap:round}
.path{fill:none;stroke:var(--path);stroke-width:calc(var(--px)*1.6);stroke-dasharray:calc(var(--px)*.1) calc(var(--px)*4.5);stroke-linecap:round}
.camino{fill:none;stroke:var(--path);stroke-width:3.5;stroke-opacity:.3;stroke-linecap:round}
.drive{fill:var(--path);fill-opacity:.1;stroke:var(--path);stroke-width:calc(var(--px)*.8)}
.stream{fill:none;stroke:var(--water);stroke-width:calc(var(--px)*2.2);stroke-linecap:round;stroke-dasharray:calc(var(--px)*6) calc(var(--px)*5);stroke-dashoffset:calc(var(--flow)*-1)}
.creek{stroke-width:calc(var(--px)*2.8)}
.pond{fill:var(--water-fill);stroke:var(--water);stroke-width:calc(var(--px)*1)}
.pipe{fill:none;stroke:var(--water);stroke-opacity:.45;stroke-width:calc(var(--px)*.8);stroke-dasharray:calc(var(--px)*1) calc(var(--px)*2)}
.bed{fill:var(--bed)}
.nursery,.compost{fill:var(--bed);stroke:var(--ink-soft);stroke-width:calc(var(--px)*.7)}
.stone{fill:var(--ink-soft);fill-opacity:.5}
.ring{fill:none;stroke:var(--ink-soft);stroke-width:calc(var(--px)*1)}
.platform{fill:none;stroke:var(--ink-soft);stroke-width:calc(var(--px)*.9);stroke-dasharray:calc(var(--px)*2) calc(var(--px)*2)}
.roof{fill:none;stroke:var(--build-stroke);stroke-opacity:.4;stroke-width:calc(var(--px)*.6);pointer-events:none}
.solar{fill:#5a6878;stroke:var(--build-stroke);stroke-opacity:.5;stroke-width:calc(var(--px)*.4)}
.bld{fill:var(--build);stroke:var(--build-stroke);stroke-width:calc(var(--px)*1.1);stroke-linejoin:round;transform-box:fill-box;transform-origin:center;transition:fill .25s ease,transform .3s cubic-bezier(.2,.8,.2,1),filter .3s}
.bld[data-place]{cursor:pointer}
.bld.hov{fill:var(--build-hov);transform:scale(1.05);filter:drop-shadow(0 0 calc(var(--px)*6) rgba(138,63,29,.35))}
.bld.on{fill:var(--build-hov)}
/* area hit regions */
.hit{fill:transparent;stroke:none;cursor:pointer;transition:fill .3s,stroke-opacity .3s}
.hit.line{fill:none;stroke:transparent;stroke-width:5;pointer-events:stroke}
.hit.hov:not(.line),.hit.on:not(.line){fill:rgba(138,63,29,.07);stroke:var(--spot);stroke-opacity:.45;stroke-width:calc(var(--px)*1.2);stroke-dasharray:calc(var(--px)*3) calc(var(--px)*3)}
.hit.line.hov{stroke:rgba(138,63,29,.12)}
.ponds-hl.hov{stroke:var(--spot)}
/* plants */
.crown{cursor:pointer;transition:opacity .3s}
.crown .c{fill:var(--tree-fill);stroke:var(--tree-line);stroke-width:.9px;vector-effect:non-scaling-stroke}
.crown.shrub .c{fill:var(--shrub-fill);stroke:rgba(90,110,70,.6)}
.crown .t{fill:var(--tree-line)}
.crown:hover .c{stroke:var(--spot);stroke-width:1.6px}
.herb{fill:var(--herb);fill-opacity:.85;cursor:pointer}
.herb:hover{fill:var(--spot)}
/* spots */
.spot{cursor:pointer;outline:none}
.spot .tap{fill:transparent}
.spot .dot{fill:var(--spot);transition:r .25s}
.spot .halo{fill:none;stroke:var(--spot);stroke-opacity:.5;animation:pulse 3.4s ease-out infinite;transform-origin:0 0}
.spot .lbl{font-family:var(--sans);font-style:italic;font-weight:400;font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;letter-spacing:.02em;opacity:0;transition:opacity .35s}
.spot.major .lbl,.spot.show .lbl,.spot.hov .lbl,.spot:focus .lbl,.spot.on .lbl{opacity:1}
.spot.hov .dot,.spot.on .dot{fill:var(--ink)}
.spot.hov .lbl,.spot.on .lbl{fill:var(--spot)}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}70%{transform:scale(2);opacity:0}100%{opacity:0}}
.layer{transition:opacity .6s ease}
#cam .layer.off{opacity:0;pointer-events:none}
.fadein{opacity:0}
.ready .fadein{opacity:1;transition:opacity 1.6s ease}

/* chrome */
.ui{position:fixed;z-index:5}
body::before{content:'';position:fixed;left:0;right:0;top:0;height:110px;z-index:4;pointer-events:none;background:linear-gradient(var(--bg),transparent);opacity:.85}
#lockup{top:22px;left:26px;pointer-events:none}
#lockup h1{font-family:'EB Garamond',Garamond,serif;font-weight:400;font-size:30px;letter-spacing:.32em;margin:0;line-height:1}
#lockup p{margin:8px 0 0;font-style:italic;font-weight:300;font-size:14px;color:var(--ink-soft);letter-spacing:.03em}
#nav{top:24px;right:26px;display:flex;gap:22px;font-variant:small-caps;letter-spacing:.12em;font-size:14px}
#nav a,#nav button{color:var(--ink);text-decoration:none;background:none;border:0;font:inherit;letter-spacing:inherit;font-variant:small-caps;cursor:pointer;padding:2px 0;border-bottom:1px solid transparent;transition:border-color .3s}
#nav a:hover,#nav button:hover{border-color:var(--ink-soft)}
#controls{left:22px;bottom:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font:400 12.5px var(--sans);letter-spacing:.04em;color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .3s}
.chip[aria-pressed=false]{opacity:.45}
.chip:focus-visible,.spot:focus-visible .dot{outline:2px solid var(--spot);outline-offset:2px}
.lab{font-variant:small-caps;letter-spacing:.14em;font-size:11.5px;color:var(--ink-soft);margin-right:4px}
#legend{font-size:12px;color:var(--ink-soft);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#legend svg{vertical-align:-3px;margin-right:5px}
#scale{right:24px;bottom:24px;font-size:11.5px;color:var(--ink-soft);text-align:right;letter-spacing:.06em}
#scale .bar{height:6px;border:1px solid var(--ink-soft);border-top:0;margin-top:4px;margin-left:auto;transition:width .2s}
#north{display:block;margin:0 0 10px auto;width:16px;opacity:.7}
#hint{left:50%;bottom:26px;transform:translateX(-50%);font-style:italic;font-weight:300;font-size:13.5px;color:var(--ink-soft);letter-spacing:.03em;transition:opacity 1s;pointer-events:none;white-space:nowrap}
#tip{position:fixed;z-index:6;pointer-events:none;background:var(--panel);border:1px solid var(--line-strong);padding:7px 11px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:260px}
#tip b{font-weight:400;display:block}
#tip i{font-weight:300;color:var(--ink-soft);font-size:12px}

/* plant card */
#card{position:fixed;z-index:8;width:320px;max-height:560px;overflow-y:auto;background:#f6f1e3;border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 18px 50px rgba(44,38,38,.22);opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .25s,transform .25s}
#card.open{opacity:1;pointer-events:auto;transform:none}
#card .x{position:absolute;top:8px;right:8px;z-index:2;width:28px;height:28px;border-radius:50%;border:0;background:rgba(246,241,227,.9);cursor:pointer;color:var(--ink)}
#card .plate{background:#fbf8ef;border-bottom:1px solid var(--line);display:flex;justify-content:center;padding:14px}
#card .plate img{max-width:100%;max-height:260px;object-fit:contain;mix-blend-mode:multiply}
#card .pc{padding:14px 18px 16px}
#card h3{font:400 19px var(--serif);letter-spacing:.06em;text-transform:uppercase;margin:0}
#card .sci{font-style:italic;font-weight:300;color:var(--ink-soft);margin:3px 0 12px;font-size:14px}
#card .sw{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:0;margin-left:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
#card dl{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;margin:0;font-size:13px;line-height:1.45}
#card dt{font-variant:small-caps;letter-spacing:.1em;color:var(--ink-soft)}
#card dd{margin:0;font-weight:300}
#card .cr{font-size:11px;color:var(--ink-soft);margin:12px 0 0;font-weight:300}
#card .cr a{color:inherit}
.draw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.draw figure{margin:0}
.draw figure:first-child:nth-last-child(odd){grid-column:1/-1}
.draw img{width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:4px;background:#fff;border:1px solid var(--line);cursor:zoom-in}
.draw figcaption{font-size:12px;color:var(--ink-soft);font-weight:300;margin-top:5px;line-height:1.4}
.diag{width:100%;height:auto;margin:6px 0 22px}
.bld.cab{fill:#7c705c}
@media (max-width:720px){#card{left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto;max-height:70%}}
/* panel */
.gal{margin:0 0 22px}
.gal .hero{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;background:var(--line);cursor:zoom-in}
.gal .strip{display:flex;gap:6px;margin-top:6px;overflow-x:auto;scrollbar-width:none}
.gal .strip img{width:64px;height:48px;object-fit:cover;border-radius:4px;cursor:pointer;opacity:.6;transition:opacity .2s;flex:none}
.gal .strip img.sel,.gal .strip img:hover{opacity:1}
#lb{position:fixed;inset:0;z-index:9;background:rgba(28,26,22,.92);display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lb.open{display:flex}
#lb img{max-width:92vw;max-height:88vh;border-radius:4px}
#tip img{display:block;width:180px;height:126px;object-fit:cover;border-radius:5px;margin:-2px -4px 6px}

#panel{position:fixed;z-index:7;top:0;right:0;height:100%;width:430px;max-width:100%;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-left:1px solid var(--line-strong);transform:translateX(102%);transition:transform .7s cubic-bezier(.2,.8,.2,1);padding:84px 40px 48px;overflow-y:auto;overscroll-behavior:contain}
#panel.open{transform:none}
#panel .close{position:absolute;top:24px;right:28px;background:none;border:0;color:var(--ink);font:300 13px var(--sans);letter-spacing:.14em;font-variant:small-caps;cursor:pointer}
#panel .kicker{font-variant:small-caps;letter-spacing:.18em;font-size:12px;color:var(--ink-soft);margin:0 0 14px}
#panel h2{font-family:var(--serif);font-weight:400;text-transform:uppercase;letter-spacing:.08em;font-size:26px;line-height:1.2;margin:0}
#panel .sub{font-style:italic;font-weight:300;text-transform:lowercase;font-size:16px;color:var(--ink-soft);margin:8px 0 26px}
#panel .prose{font-weight:300;font-size:16px;line-height:1.65}
#panel .prose p{margin:0 0 15px}
#panel .prose ul,#panel .prose ol{margin:0 0 16px;padding-left:20px}
#panel .prose li{margin-bottom:7px}
#panel .prose strong{font-weight:400}
#panel .prose a{color:var(--ink);text-decoration-color:var(--ink-soft);text-underline-offset:3px}
#panel .prose a.xref{cursor:pointer;color:var(--spot);text-decoration:none;border-bottom:1px solid rgba(138,63,29,.4);font-style:italic}
#panel h3.subj{font-family:var(--serif);font-weight:400;text-transform:uppercase;letter-spacing:.1em;font-size:15px;margin:34px 0 14px;padding-top:22px;border-top:1px solid var(--line-strong)}
#panel h4{font-variant:small-caps;letter-spacing:.14em;font-weight:400;font-size:13.5px;color:var(--ink-soft);margin:24px 0 8px}
#panel .spirit{margin:0 0 26px;padding:16px 18px;border-left:2px solid var(--spot);background:rgba(138,63,29,.05);font-size:15px;line-height:1.6;font-weight:300}
#panel .spirit b{display:block;font-variant:small-caps;letter-spacing:.14em;font-weight:400;font-size:12px;color:var(--spot);margin-bottom:6px}
#panel .go{display:inline-block;margin-top:18px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink-soft);font-variant:small-caps;letter-spacing:.14em;font-size:14px;padding-bottom:3px}
#panel .src{margin-top:30px;font-size:12px;color:var(--ink-soft);font-style:italic;font-weight:300}
#panel .step{display:flex;justify-content:space-between;gap:16px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line-strong)}
#panel .step button{background:none;border:0;color:var(--ink-soft);font:300 italic 14px var(--sans);cursor:pointer;padding:0;text-align:left}
#panel .step button:last-child{text-align:right}
#panel .step button:hover{color:var(--ink)}
#panel ul.index{list-style:none;margin:0 0 10px;padding:0}
#panel ul.index li{border-top:1px solid var(--line)}
#panel ul.index button{width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:13px 0;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font:400 15px var(--serif);letter-spacing:.06em;text-transform:uppercase}
#panel ul.index button span{font:italic 300 13px var(--sans);text-transform:lowercase;letter-spacing:.02em;color:var(--ink-soft);text-align:right}
#panel ul.index button:hover{color:var(--spot)}
.fade-swap{animation:swap .6s ease}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:720px){
  #lockup{top:16px;left:18px} #lockup h1{font-size:21px} #lockup p{font-size:12.5px}
  #nav{right:16px;top:19px;gap:14px;font-size:13px}
  #nav .wide{display:none}
  #controls{left:12px;right:12px;bottom:12px}
  #legend{display:none}
  #scale{display:none}
  #hint{bottom:auto;top:76px;font-size:12.5px}
  #panel{top:auto;bottom:0;height:64%;width:100%;border-left:0;border-top:1px solid var(--line-strong);border-radius:18px 18px 0 0;transform:translateY(104%);padding:46px 24px 30px}
  #panel .close{top:16px;right:20px}
  #panel h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  .spot .halo{animation:none;opacity:0}
  .drawn .contour{transition:none}
}
</style>
</head>

const PLACES = [{"id": "entrance", "name": "The Entrance", "sub": "a living portal", "x": 72.0, "y": 133.0, "a": "e", "major": 1, "hit": {"circle": [72.0, 133.0, 4]}, "body": ["A metal trellis stands at the north end of the parking area, where the path enters the oak forest. Jannis welded it here on the land from rebar, about four metres tall.", "The plan is to cover it with chayote in its first year and to train grapevines in as its long-term frame, a nod to the vineyard these terraces once held."], "link": {"t": "Made by Jannis", "u": "https://www.instagram.com/jannis.flow/"}, "photos": [], "draw": [], "label": null}, {"id": "oaks", "name": "The Old Oaks", "sub": "the oldest trees on the land", "x": 100.5, "y": 100.5, "a": "w", "major": 1, "hit": {"circle": [100.5, 100.5, 6.5]}, "spirit": {"name": "The old oaks", "text": "The oldest children of the land: build a small altar at their roots from what the forest floor offers, and set down what you are carrying."}, "body": ["The lower half of the land is oak forest, recovering since the fires of 2010.", "We look after it gently. We thin the trees to deal with fungal disease and to let more light reach the forest floor, repair the old terraces where they were eroding, and build small earthworks that hold water in the slope.", "Under the oaks we are planting a woodland garden of shade-loving plants, to bring back diversity and soil life."], "draw": [{"src": "img/map-woodland.jpg", "cap": "Planning base for the woodland garden under the oaks, drawn in QGIS"}], "photos": [], "label": null}, {"id": "van", "name": "Bertha", "label": "bertha", "sub": "a red Ford Transit, parked for good", "x": 64.9, "y": 103.0, "a": "e", "hit": {"buildings": ["campervan"]}, "photos": ["img/web-van.jpg", "img/van-2.jpg", "img/van-3.jpg"], "body": ["Bertha has retired from the road and stays on the land as a cosy room for short stays."], "draw": [], "major": 0}, {"id": "creek", "name": "The Creek", "sub": "the mother of the land", "x": 114, "y": 92, "a": "e", "major": 1, "hit": {"river": 1, "ponds": ["Creek pool · lower", "Creek pool · sauna"]}, "spirit": {"name": "The creek", "text": "The mother of the land: dig the sand at her edges so the channel can breathe, pull the brambles from her banks, whisper a wish."}, "photos": ["img/creek-1.jpg", "img/creek-2.jpg", "img/creek-3.jpg", "img/creek-4.jpg"], "body": ["The creek runs along the eastern edge of the land, with small pools held along its bed. The sauna sits beside it, and the creek is the cold after the heat.", "When the water silo runs low, a small pump lifts creek water up to it."], "draw": [], "label": null}, {"id": "kitchen", "name": "The Kitchen", "sub": "shared by everyone on the land", "x": 104.3, "y": 94.2, "a": "s", "hit": {"buildings": ["Kitchen"]}, "photos": ["img/kitchen-1.jpg"], "body": ["The communal kitchen sits just below the yurt. Everyone living on the land cooks and eats here.", "Each day starts with a check-in, and every new arrival gets a warm orientation."], "draw": [], "label": null, "major": 0}, {"id": "lamppost", "name": "The Lamp Post", "label": "lamp post", "sub": "news carried in light", "x": 86.3, "y": 88.4, "a": "w", "hit": {"circle": [86.3, 88.4, 3.5]}, "photos": ["img/web-lamp.jpg"], "body": ["The lamp post by the path carries the land's most important news. It pulses red when a fire is close or upwind of us, orange when the battery runs low, and blue when the water silo runs low. Anyone walking past knows, phone in pocket.", "Fire season is part of the year here. In the summer of 2025 we watched the Gerês mountains burn from the hill above the yurt.", "The signals come from Vigia, our fire watch, and the land dashboard, both running on Home Assistant. The dashboard hangs on the kitchen wall and lives on our phones; its cards are open source."], "draw": [{"src": "img/lab-dashboard-card.jpg", "cap": "The land dashboard: weather, fire risk, water, power and air on one screen"}], "link": {"t": "More in the Lab", "u": "https://lab.acorujeira.pt"}, "major": 0}, {"id": "yurt", "name": "The Yurt & the Perch", "label": "yurt & the perch", "sub": "a winter nest space", "x": 100.5, "y": 89.5, "a": "w", "major": 1, "hit": {"buildings": ["Yurt", "Deck"]}, "photos": ["img/yurt-2.jpg", "img/yurt-1.jpg", "img/lab-yurt-ext-outside.jpg", "img/yurt-5.jpg", "img/yurt-3.jpg", "img/yurt-7.jpg"], "body": ["A seven-metre Mongolian yurt with an egg-shaped wood burner, and the Perch, an extension Eska built by hand in summer 2026. The Perch is glazed with glass salvaged from a friend's project, and its vaulted roof cuts into the yurt's own radius.", "Like most new buildings on the land, it is clad in charred boards. We char them the Japanese way, called yakisugi, in a chimney of three boards tied together and stood on end. The fire takes the surface and leaves a skin of carbon that protects the wood from sun and rain. The sauna was our first try, in 2024."], "draw": [{"src": "img/lab-yurt-ext-model.jpg", "cap": "The Perch modelled in Rhino"}, {"src": "img/lab-yurt-ext-line.jpg", "cap": "Line drawing of the frame"}, {"src": "img/lab-yurt-ext-frame.jpg", "cap": "Frame study"}], "link": {"t": "Winter Nest", "u": "https://winternest.acorujeira.pt"}}, {"id": "woodshed", "name": "The Woodshed", "sub": "a reciprocal arch", "x": 99.7, "y": 79.4, "a": "e", "hit": {"buildings": ["wood storage"]}, "photos": ["img/woodshed-1.jpg", "img/woodshed-2.jpg", "img/woodshed-3.jpg"], "body": ["The woodshed sits on the terrace above the yurt, against an old stone wall, close to all three wood stoves. Its frame holds itself up: short timbers rest on one another in a woven pattern, after the self-supporting bridges Leonardo da Vinci sketched.", "We worked out the geometry in code before cutting any wood. It is roofed with charred cryptomeria shingles and holds about four and a half cubic metres of firewood."], "draw": [{"src": "img/lab-woodshed-model.jpg", "cap": "The arch in 3D, coloured by layer"}, {"src": "img/lab-woodshed-tool.jpg", "cap": "The calculator that sets each strip and angle"}, {"src": "img/lab-woodshed-runner.jpg", "cap": "Cut sheet for a runner"}], "link": {"t": "More in the Lab", "u": "https://lab.acorujeira.pt"}, "label": null, "major": 0}, {"id": "workshop", "name": "The Workshop", "sub": "where most things get made", "x": 83.6, "y": 71.2, "a": "n", "major": 1, "hit": {"buildings": ["workshop"]}, "photos": ["img/workshop-1.jpg", "img/lab-workshop-card.jpg", "img/lab-lantern-lit.jpg", "img/workshop-2.jpg"], "body": ["A sheltered workshop of about 37 m² on the terrace above the yurt, with a welder, a table saw and a wall of tools. It began as a small roundwood shelter, was closed in during autumn 2025 and grew by another six by five metres in 2026.", "The frame is eucalyptus from the land, and the studs are offcuts from a local lumber yard.", "In 2026 Eska made seventeen wooden lamps here, each sketched by hand, modelled in Rhino, laser-cut from plywood and wired by hand. With Anca, they are becoming lanterns of 266 LEDs that simulate fire and respond to music."], "draw": [{"src": "img/lab-lantern-rhino.jpg", "cap": "Lantern model in Rhino"}, {"src": "img/lab-lantern-cut-sheets.jpg", "cap": "Laser-cut sheets for the lamp ribs"}], "link": {"t": "More in the Lab", "u": "https://lab.acorujeira.pt"}, "label": null}, {"id": "nursery", "name": "The Nursery", "sub": "the next forest, in pots", "x": 76.3, "y": 72.1, "a": "w", "hit": {"nursery": 1}, "body": ["Seedlings and cuttings raised on the land, waiting for their place in the firebreak and the woodland garden."], "photos": [], "draw": [], "label": null, "major": 0}, {"id": "spring", "name": "The Breathing Spring", "label": "the spring", "sub": "seasonal, for now", "x": 57.5, "y": 70.5, "a": "w", "major": 1, "hit": {"spring": 1, "ponds": ["Spring pond", "Spring pond · lower pool"]}, "spirit": {"name": "The Shrine of the Breathing Spring", "text": "Visit the spring pool twice, in the afternoon heat and in the morning cool, and see the eucalyptus drinking."}, "body": ["The spring once ran all year. Since the 2010 fire, on ground already worn down by eucalyptus, it runs for only part of it.", "Raising the water table so that it flows all year again is one of the main goals behind the planting across the land, alongside more diversity and more water held in the soil."], "draw": [{"src": "img/map-spring.jpg", "cap": "Water map of the slope above the spring: where water gathers and sinks in"}], "photos": []}, {"id": "firebreak", "name": "The Living Firebreak", "label": "the firebreak", "sub": "eucalyptus giving way to food forest", "x": 40.0, "y": 80.0, "a": "w", "major": 1, "hit": {"slope": 1}, "spirit": {"name": "The eucalyptus forest", "text": "The youngest spirit, from the other side of the world: sit with your back to her bark and take in the creak and sway; she teaches how to belong somewhere you are not from."}, "photos": ["img/web-f44.jpg", "img/web-f62.jpg", "img/web-f97.jpg", "img/web-f186.jpg", "img/firebreak-1.jpg"], "body": ["A power line crosses the top of the land through a slope of eucalyptus regrowth, which in a dry summer would carry fire up to the wires. We are replacing it, patch by patch, with a low, fire-resistant food forest.", "At the first Owl's Nest gathering, in October 2025, we felled about 70 eucalyptus along the contours and laid the trunks and branches across the slope to hold water and soil. Then we planted around 150 trees and shrubs: strawberry tree, wild olive, elder, lavender and rosemary along the outer edge, and small mixed groups behind.", "There is no drip irrigation on the slope, only a hose for the worst of the drought. Over 70% came through the first year.", "The slope is also becoming a gallery of land art made from its own wood, starting with a large owl by Sarah Duryea and Morley."], "draw": [{"src": "img/map-firebreak.jpg", "cap": "Water map of the eucalyptus slope, with the October 2025 planting"}]}, {"id": "belltent", "name": "Bell Tent Terrace", "sub": "a round platform, seven metres across", "x": 25.9, "y": 81.4, "a": "w", "hit": {"platform": 1}, "photos": ["img/belltent-1.jpg"], "body": ["A circular terrace levelled for a bell tent at the western edge of the land."], "draw": [], "label": null, "major": 0}, {"id": "reservoir", "name": "The Old Reservoir", "sub": "a dry granite ring", "x": 90.7, "y": 51.7, "a": "n", "hit": {"reservoir": 1}, "body": ["A former water reservoir, now an empty ring of granite wall about sixty centimetres thick."], "photos": [], "draw": [], "label": null, "major": 0}, {"id": "silo", "name": "The Water Silo", "label": "water silo", "sub": "five thousand litres", "x": 89.7, "y": 16.3, "a": "e", "hit": {"storage": 1}, "photos": ["img/silo-2.jpg"], "body": ["The land's water is stored in a 5,000 litre silo at the top of the footpath. A sensor in its lid reports the level to the land dashboard.", "When the level drops below 1,000 litres and the battery is above 80%, the creek pump starts by itself. It runs until the silo is full or the battery falls to 60%."], "draw": [], "major": 0}, {"id": "toilet", "name": "The Poop Shrine", "label": "the poop shrine", "sub": "a compost toilet", "x": 98.5, "y": 54.9, "a": "w", "hit": {"buildings": ["compost toilet"]}, "photos": ["img/lab-shrine-outside.jpg", "img/lab-shrine-inside.jpg"], "body": ["A compost toilet on the slope above the Clayhouse, built by Eska in summer 2026 from scrap wood, clad in charred boards and roofed with salvaged flashing. An almond-shaped window lights the inside."], "draw": [{"src": "img/lab-shrine-model.jpg", "cap": "Modelled in Rhino"}, {"src": "img/lab-shrine-drawing.jpg", "cap": "Frame and parts"}], "major": 0}, {"id": "cabinet", "name": "The Power Cabinet", "label": "power cabinet", "sub": "the off-grid system", "x": 106.7, "y": 51.0, "a": "w", "hit": {"cabinet": 1}, "body": ["This small cabinet on the north wall of the Clayhouse holds the land's power and internet. There is no grid connection.", "Eight solar panels on the Clayhouse roof, 3,480 W in two arrays, charge a 48 V lithium battery bank of about 9.6 kWh through two Victron solar chargers. A Victron MultiPlus-II turns that into ordinary 230 V for the land, and a generator stands by as backup.", "A Starlink dish on the roof brings the internet. A router, Home Assistant and the solar monitor share the cabinet, and a single access point carries the Wi-Fi to the yurt."], "diagram": 1, "photos": [], "draw": [], "major": 0}, {"id": "clayhouse", "name": "The Clayhouse", "label": "the clayhouse", "sub": "a winter nest space", "x": 107.9, "y": 54.6, "a": "n", "major": 1, "hit": {"buildings": ["clayhouse"], "solar": 1}, "photos": ["img/clayhouse-1.jpg", "img/clayhouse-2.jpg", "img/clayhouse-3.jpg"], "body": ["A naturally built tiny house, designed by Eska with clay work by Lea, from locally sourced and salvaged materials. It is one of the two spaces held through the winter, with a wood stove and a desk by the corner window.", "The solar panels on its roof power the whole land."], "link": {"t": "Winter Nest", "u": "https://winternest.acorujeira.pt"}, "draw": []}, {"id": "garden", "name": "The Medicinal Garden", "label": "medicinal garden", "sub": "planted with Leonie of Millefolium", "x": 116.2, "y": 61.2, "a": "s", "major": 1, "hit": {"beds_near": [116, 60, 9]}, "photos": ["img/web-herbs.jpg", "img/garden-1.jpg", "img/garden-2.jpg", "img/garden-3.jpg", "img/garden-4.jpg"], "body": ["When we arrived these terraces were thick with brambles. Over five years we cleared them back, cultivated the soil, and added carbon and manure from neighbours' animals to rebuild fertility. Over twenty medicinal plants now grow in their place.", "Where the terraces were eroding, we rebuilt them by digging and by laying prunings and other biomass on contour along their outer edges, which builds the soil back up.", "They go into the steam ceremonies in the sauna below, into tea, and onto the skin. Look and smell as much as you like; please ask before picking anything.", "Each dot on the map is a plant. Tap one to meet it."], "link": {"t": "Ask the garden", "u": "https://garden.acorujeira.pt"}, "draw": []}, {"id": "sauna", "name": "The Sauna", "sub": "steam in the banya tradition", "x": 124.6, "y": 59.8, "a": "e", "major": 1, "hit": {"buildings": ["sauna"]}, "spirit": {"name": "The sauna", "text": "Sweep the floor, refill the water at the entrance, lift the veniki out of the water to rest, feed the stove gently when the fire is breathing. Or simply bring silence, or a song to the stones."}, "photos": ["img/sauna-1.jpg", "img/sauna-2.jpg", "img/sauna-3.jpg", "img/sauna-4.jpg"], "body": ["A wood-fired sauna beside the creek, seating eight. Eska designed it and built it by hand with Omali and Damien, from Japanese cedar they planed themselves.", "It is home to Steamology: guided steam ceremonies in the Russian banya tradition, moving through heat, steam, whisking with leafy brooms and the cold of the creek. Over a hundred ceremonies have been held here since 2024."], "draw": [{"src": "img/lab-sauna-model-line.jpg", "cap": "The egg-shaped sauna, drawn in Rhino"}, {"src": "img/lab-sauna-model-night.jpg", "cap": "Rendered at night"}, {"src": "img/lab-sauna-parts.jpg", "cap": "Parts laid out for cutting"}], "link": {"t": "Private sessions", "u": "https://acorujeira.pt"}, "label": null}];

function crownD(n,seed){

  let d=`M${pts[0][0].toFixed(3)} ${pts[0][1].toFixed(3)}`;
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];const L=Math.hypot(m[0],m[1])||1;const bulge=1.32;
    d+=`Q${(m[0]/L*bulge*Math.hypot(...a)).toFixed(3)} ${(m[1]/L*bulge*Math.hypot(...a)).toFixed(3)} ${b[0].toFixed(3)} ${b[1].toFixed(3)}`}
  return d+'Z';
}

const fitK=()=>Math.min(W/(CORE.x1-CORE.x0),H/(CORE.y1-CORE.y0))*(W<720?1.02:.9);
let kMin=fitK()*.6, kMax=70;
const home=()=>({x:(CORE.x0+CORE.x1)/2,y:(CORE.y0+CORE.y1)/2+(W<720?4:0),k:fitK()});

  cur.k=Math.exp(Math.log(cur.k)+(Math.log(tgt.k)-Math.log(cur.k))*a);

  if(Math.abs(cur.k-lastK)/cur.k>0.004){

  const dx=e.clientX-prev.x, dy=e.clientY-prev.y; moved+=Math.abs(dx)+Math.abs(dy);
  if(moved>5){svg.classList.add('dragging');setHover(null);tip.style.opacity=0}
  tgt.x-=dx/cur.k;tgt.y-=dy/cur.k;cur.x-=dx/cur.k;cur.y-=dy/cur.k;
  vel={x:dx,y:dy};lastMove=performance.now();clampT();if(moved>6)hideHint();
});
const up=e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(ptrs.size===0){svg.classList.remove('dragging');
    if(moved<6&&downAt)tap(e);
    else if(performance.now()-lastMove<60){tgt.x-=vel.x*7/cur.k;tgt.y-=vel.y*7/cur.k;clampT()}
    downAt=null;
  }
};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
function tap(e){
  const els=document.elementsFromPoint(e.clientX,e.clientY);
  const t=els[0]||downAt.t;
  const plEl=els.find(x=>x.closest&&x.closest('.crown,.herb'));
  const spotEl=els.find(x=>x.closest&&x.closest('.spot'));
  const pl=(spotEl&&!spotEl.classList.contains('tap'))?null:(plEl&&plEl.closest('.crown,.herb'));
  const pe=t.closest&&t.closest('[data-place]');
  if(pl){tip.style.opacity=0;plantCard(pl.dataset.sci,e);return}
  if(pe){closeCard();openPlace(pe.dataset.place);return}
  if(card.classList.contains('open')){closeCard();return}
  closePanel();
}
function zoomAt(mx,my,f,immediate){
  const wx=tgt.x+(mx-W/2)/tgt.k, wy=tgt.y+(my-H/2)/tgt.k;
  const nk=Math.min(kMax,Math.max(kMin,tgt.k*f));
  tgt.x=wx-(mx-W/2)/nk;tgt.y=wy-(my-H/2)/nk;tgt.k=nk;
  if(immediate)cur={...tgt};clampT();hideHint();
}
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0016)))},{passive:false});
svg.addEventListener('dblclick',e=>zoomAt(e.clientX,e.clientY,1.8));

/* hover: light up every part of a place together */
const tip=$('#tip'); let hovId=null;
function setHover(id){
  if(id===hovId)return;
  if(hovId)(placeEls[hovId]||[]).forEach(e=>e.classList.remove('hov'));
  hovId=id; if(id)(placeEls[id]||[]).forEach(e=>e.classList.add('hov'));
}
function showTip(pl,e){
  const n=pl.dataset.n;tip.innerHTML=`<b>${n.charAt(0).toUpperCase()+n.slice(1)}</b><i>${pl.dataset.l}</i>`;
  tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';tip.style.opacity=1;
}
function hover(e){
  if(e.pointerType&&e.pointerType!=='mouse')return;
  const t=e.target;
  const pl=t.closest&&t.closest('.crown,.herb');
  if(pl){showTip(pl,e);setHover(null);return}
  tip.style.opacity=0;
  const pe=t.closest&&t.closest('#map [data-place]');
  const id=pe?pe.dataset.place:null; setHover(id);
  if(id&&id!==active){const p=byId[id];tip.innerHTML=(p.photos.length?`<img src="${p.photos[0]}" alt="">`:'')+`<b>${p.name}</b><i>${p.sub}</i>`;
    const x=Math.min(e.clientX+16,innerWidth-210),y=Math.min(e.clientY+16,innerHeight-(p.photos.length?190:60));tip.style.left=x+'px';tip.style.top=y+'px';tip.style.opacity=1}
}
svg.addEventListener('pointerleave',()=>{tip.style.opacity=0;setHover(null)});

/* ---------- plant cards (from Flora) ---------- */
const card=$('#card');
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function plantCard(sci,e){
  const p=PLANTS[sci]; if(!p)return;
  let h=`<button class="x" aria-label="Close">✕</button>`;
  if(p.plate)h+=`<div class="plate"><img src="${p.plate.src}" alt="Botanical plate of ${p.sci}"></div>`;
  h+=`<div class="pc"><h3>${cap(p.common)||p.sci}</h3><p class="sci">${p.sci}${p.colour?` <i class="sw" style="background:${p.colour}"></i>`:''}</p>`;
  if(p.info.length)h+=`<dl>${p.info.map(([k,v])=>`<dt>${k}</dt><dd>${cap(v)}</dd>`).join('')}</dl>`;
  if(p.plate)h+=`<p class="cr">Plate${p.plate.genus?' (same genus)':''}: ${p.plate.page?`<a href="${p.plate.page}" target="_blank" rel="noopener">${p.plate.credit||'source'}</a>`:p.plate.credit}</p>`;
  h+='</div>';
  card.innerHTML=h; card.classList.add('open'); card.scrollTop=0;
  if(!isMobile()){const w=320,hh=Math.min(innerHeight-40,560);let x=e.clientX+18,y=e.clientY-120;if(x+w>innerWidth-(panel.classList.contains('open')?440:16))x=e.clientX-w-18;y=Math.max(16,Math.min(y,innerHeight-hh-16));card.style.left=x+'px';card.style.top=y+'px'}
}
function closeCard(){card.classList.remove('open')}
card.addEventListener('click',e=>{if(e.target.closest('.x'))closeCard()});
card.addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- panel ---------- */
const panel=$('#panel'), pbody=$('#pbody');
let active=null;
const isMobile=()=>W<720;
function flyTo(x,y,k){tgt.k=k;tgt.x=x+(isMobile()?0:215/k);tgt.y=y+(isMobile()?H*0.3/k:0);clampT()}
function mark(id,on){(placeEls[id]||[]).forEach(e=>e.classList.toggle('on',on))}
function gallery(ph,alt){
  return `<div class="gal"><img class="hero" src="${ph[0]}" alt="${alt}">${ph.length>1?`<div class="strip">${ph.map((s,i)=>`<img src="${s}" alt="" class="${i?'':'sel'}">`).join('')}</div>`:''}</div>`;
}
const DIAGRAM=`<svg class="diag" viewBox="0 0 340 250" role="img" aria-label="Diagram of the off-grid power system">
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8a3f1d"/></marker></defs>
<g font-family="Lato,system-ui,sans-serif" font-size="10.5" fill="#2C2626">
<rect x="10" y="10" width="140" height="40" rx="6" fill="#ece5cf" stroke="#3B4438"/><text x="80" y="27" text-anchor="middle">Solar array A</text><text x="80" y="41" text-anchor="middle" fill="#6b625a">4 × 500 W</text>
<rect x="190" y="10" width="140" height="40" rx="6" fill="#ece5cf" stroke="#3B4438"/><text x="260" y="27" text-anchor="middle">Solar array B</text><text x="260" y="41" text-anchor="middle" fill="#6b625a">4 × 370 W</text>
<rect x="10" y="78" width="140" height="32" rx="6" fill="#f4efe0" stroke="#3B4438"/><text x="80" y="98" text-anchor="middle">Victron charger</text>
<rect x="190" y="78" width="140" height="32" rx="6" fill="#f4efe0" stroke="#3B4438"/><text x="260" y="98" text-anchor="middle">Victron charger</text>
<rect x="95" y="136" width="150" height="34" rx="6" fill="#3B4438"/><text x="170" y="150" text-anchor="middle" fill="#FFFDF5">48 V lithium battery</text><text x="170" y="163" text-anchor="middle" fill="#cfc8b2">about 9.6 kWh</text>
<rect x="95" y="198" width="150" height="40" rx="6" fill="#ece5cf" stroke="#3B4438"/><text x="170" y="215" text-anchor="middle">MultiPlus-II inverter</text><text x="170" y="229" text-anchor="middle" fill="#6b625a">230 V to the land</text>
<rect x="268" y="203" width="64" height="30" rx="6" fill="none" stroke="#3B4438" stroke-dasharray="3 3"/><text x="300" y="222" text-anchor="middle">generator</text>
<g stroke="#8a3f1d" stroke-width="1.4" fill="none" marker-end="url(#ar)"><path d="M80 50V76"/><path d="M260 50V76"/><path d="M80 110L140 134"/><path d="M260 110L200 134"/><path d="M170 170V196"/><path d="M268 218H248"/></g>
</g></svg>`;
function render(p){
  const i=PLACES.indexOf(p), prev=PLACES[(i-1+PLACES.length)%PLACES.length], next=PLACES[(i+1)%PLACES.length];
  let h=`<div class="fade-swap"><p class="kicker">${String(i+1).padStart(2,'0')} · ${PLACES.length}</p><h2>${p.name}</h2><p class="sub">${p.sub}</p>`;
  if(p.photos.length)h+=gallery(p.photos,p.name);
  h+='<div class="prose">'+p.body.map(t=>`<p>${t}</p>`).join('')+'</div>';
  if(p.diagram)h+=DIAGRAM;
  if(p.spirit)h+=`<div class="spirit"><b>at the gatherings: ${p.spirit.name.toLowerCase()}</b>${p.spirit.text}</div>`;
  if(p.draw.length)h+=`<h3 class="subj">From the drawing board</h3><div class="draw">${p.draw.map(d=>`<figure><img src="${d.src}" alt="${d.cap}"><figcaption>${d.cap}</figcaption></figure>`).join('')}</div>`;
  if(p.link)h+=`<a class="go" target="_blank" rel="noopener" href="${p.link.u}">${p.link.t} →</a>`;
  h+=`<div class="step"><button data-go="${prev.id}">← ${prev.name.toLowerCase()}</button><button data-go="${next.id}">${next.name.toLowerCase()} →</button></div></div>`;
  return h;
}
function openPlace(id){
  const p=byId[id]; if(!p)return;
  if(active)mark(active,false);
  active=id; mark(id,true);
  pbody.innerHTML=render(p); panel.scrollTop=0;
  panel.classList.add('open');
  flyTo(p.x,p.y,Math.max(cur.k,16));
  try{history.replaceState(null,'','#'+id)}catch(_){}
  hideHint();
}
function openIndex(){
  if(active){mark(active,false);active=null}
  pbody.innerHTML=`<div class="fade-swap"><p class="kicker">the land</p><h2>The story of this land</h2><p class="sub">one hectare in the minho</p><div class="prose">${INTRO.story.map(t=>`<p>${t}</p>`).join('')}</div>
  <h3 class="subj">Places</h3><ul class="index">${PLACES.map(p=>`<li><button data-go="${p.id}">${p.name}<span>${p.sub}</span></button></li>`).join('')}</ul>
  <h3 class="subj">About this map</h3><div class="prose">${INTRO.map.map(t=>`<p>${t}</p>`).join('')}</div></div>`;
  panel.scrollTop=0; panel.classList.add('open');
}
function closePanel(){
  panel.classList.remove('open');
  if(active){mark(active,false);active=null}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}
}
pbody.addEventListener('click',e=>{
  const st=e.target.closest('.strip img');if(st){const g=st.closest('.gal');g.querySelector('.hero').src=st.src;g.querySelectorAll('.strip img').forEach(i=>i.classList.toggle('sel',i===st));return}
  const fig=e.target.closest('.draw img');if(fig){$('#lb img').src=fig.src;$('#lb').classList.add('open');return}
  const hero=e.target.closest('.hero');if(hero){$('#lb img').src=hero.src;$('#lb').classList.add('open');return}
  const b=e.target.closest('[data-go]');if(b)return openPlace(b.dataset.go);
});
$('#close').addEventListener('click',closePanel);
$('#lb').addEventListener('click',()=>$('#lb').classList.remove('open'));
$('#btn-index').addEventListener('click',()=>panel.classList.contains('open')&&!active?closePanel():openIndex());
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#lb').classList.contains('open'))return $('#lb').classList.remove('open');if(card.classList.contains('open'))return closeCard();closePanel()}
  if(active&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const i=PLACES.findIndex(p=>p.id===active);openPlace(PLACES[(i+(e.key==='ArrowRight'?1:-1)+PLACES.length)%PLACES.length].id)}
});
addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId[id]&&id!==active)openPlace(id)});
document.querySelectorAll('#layers .chip').forEach(b=>b.addEventListener('click',()=>{
  const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);
  document.getElementById(b.dataset.layer).classList.toggle('off',!on);
}));
if(matchMedia('(hover:none)').matches)$('#hint').textContent='drag to wander · pinch to zoom · tap a place';

/* ---------- intro ---------- */
setTimeout(()=>PLACES.forEach(p=>p.photos.slice(0,1).forEach(s=>{const i=new Image();i.src=s})),2500);
requestAnimationFrame(frame);
requestAnimationFrame(()=>requestAnimationFrame(()=>{
  cam.classList.remove('drawing');cam.classList.add('drawn');
  setTimeout(()=>document.body.classList.add('ready'),reduce?0:900);
  const id=location.hash.slice(1);
  if(byId[id])setTimeout(()=>openPlace(id),reduce?0:1600);
}));
</script>
